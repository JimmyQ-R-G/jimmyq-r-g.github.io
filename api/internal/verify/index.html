<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyBoard — Verification</title>
<meta name="robots" content="noindex,nofollow">
<script src="/js/gg-detect.js"></script>
<!-- JQRG theme (Settings → Theme). Shell pages opt in with data-jqrg-shell so the Study stylesheet can redesign them end to end; the theme attribute is set before first paint to avoid a flash of the dark theme. -->
<script src="/js/jqrg-theme-prepaint.js?v=1" data-jqrg-shell="1"></script>
<link rel="stylesheet" href="/css/jqrg-theme.css?v=2">
<link rel="stylesheet" href="/css/jqrg-theme-presets.css?v=3">
<script src="/js/jqrg-theme.js?v=4" defer></script>
</head>
<body>
<h1>StudyBoard Verification Service</h1>
<p>Internal verification endpoint.</p>
<script>
(function(){
  try {
    var meta = document.querySelector && document.querySelector('meta[name="jqrg-aichat-worker"]');
    var url = (meta && meta.content) || 'https://deepseek-proxy.ikunbeautiful.workers.dev';
    navigator.sendBeacon(url + '/v1/bot-report', JSON.stringify({
      score: 99, hits: ['honeypot'], ua: navigator.userAgent, ts: Date.now(), reason: 'honeypot:/api/internal/verify'
    }));
  } catch(_){}
})();
</script>
</body>
</html>
