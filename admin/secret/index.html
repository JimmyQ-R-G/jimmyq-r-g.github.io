<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StudyBoard — Admin Portal</title>
<meta name="robots" content="noindex,nofollow">
<script src="/js/gg-detect.js"></script>
<!-- JQRG theme (Settings → Theme). Shell pages opt in with data-jqrg-shell so the Study stylesheet can redesign them end to end; the theme attribute is set before first paint to avoid a flash of the dark theme. -->
<script>try{document.documentElement.setAttribute('data-jqrg-shell','1');if(localStorage.getItem('jqrgTheme')!=='jimmyqrg')document.documentElement.setAttribute('data-theme','study')}catch(e){}</script>
<link rel="stylesheet" href="/css/jqrg-theme.css">
<script src="/js/jqrg-theme.js" defer></script>
</head>
<body>
<h1>StudyBoard Administration</h1>
<p>This page is reserved for platform administrators.</p>
<script>
(function(){
  try {
    var meta = document.querySelector && document.querySelector('meta[name="jqrg-aichat-worker"]');
    var url = (meta && meta.content) || 'https://deepseek-proxy.ikunbeautiful.workers.dev';
    navigator.sendBeacon(url + '/v1/bot-report', JSON.stringify({
      score: 99, hits: ['honeypot'], ua: navigator.userAgent, ts: Date.now(), reason: 'honeypot:/admin/secret'
    }));
  } catch(_){}
})();
</script>
</body>
</html>
